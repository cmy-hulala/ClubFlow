<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClubFlow | Officer copilot</title>
    <meta
      name="description"
      content="ClubFlow is an officer copilot for student clubs. One event brief becomes channel copy, and PayPal sandbox collects fees, sends invoices, pays speakers, and reconciles the event."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="lightbox" aria-label="Preview">
      <button type="button" class="light-close" data-action="close-light" id="lightbox-close">×</button>
      <img id="lightbox-img" alt="" />
    </dialog>
    <script type="module" src="/src/main.ts"></script>
    <noscript>ClubFlow needs JavaScript to generate previews in this browser.</noscript>
  </body>
</html>
